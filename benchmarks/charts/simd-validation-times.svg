er" x="188.0" y="248.0" width="433.0" height="16" rx="2"/><text x="628.0" y="261.0">31.38 ms</text><text x="14" y="291.0">segmentio</text><rect class="peer" x="188.0" y="278.0" width="62.7" height="16" rx="2"/><text x="257.7" y="291.0">4.54 ms</text><text class="panel" x="14" y="361.0">String-rich payloads · escaped + Unicode files</text><text class="gain" x="14" y="382.0">SIMD: 9.8× faster than fastest strict peer · 3.0× faster than portable</text><line class="grid" x1="188.0" y1="392.0" x2="188.0" y2="564.0"/><text class="note" x="188.0" y="389.0" text-anchor="middle">0 ns</text><line class="grid" x1="533.0" y1="392.0" x2="533.0" y2="564.0"/><text class="note" x="533.0" y="389.0" text-anchor="middle">500.0 µs</text><line class="grid" x1="878.0" y1="392.0" x2="878.0" y2="564.0"/><text class="note" x="878.0" y="389.0" text-anchor="middle">1.00 ms</text><text x="14" y="419.0">vibejson portable</text><rect class="portable" x="188.0" y="406.0" width="14.5" height="16" rx="2"/><text x="209.5" y="419.0">21.1 µs</text><text x="14" y="449.0">vibejson SIMD</text><rect class="simd" x="188.0" y="436.0" width="4.9" height="16" rx="2"/><text x="199.9" y="449.0">7.1 µs</text><text x="14" y="479.0">encoding/json</text><rect class="reference" x="188.0" y="466.0" width="48.8" height="16" rx="2"/><text x="243.8" y="479.0">70.7 µs</text><text x="14" y="509.0">go-json</text><rect class="peer" x="188.0" y="496.0" width="557.1" height="16" rx="2"/><text x="752.1" y="509.0">807.3 µs</text><text x="14" y="539.0">segmentio</text><rect class="peer" x="188.0" y="526.0" width="48.3" height="16" rx="2"/><text x="243.3" y="539.0">70.0 µs</text><text class="note" x="14" y="598">jsoniter is omitted here: its Valid API accepts trailing non-space bytes. All included validators reject the checked late-invalid variant.</text><text class="note" x="14" y="613">Source: benchmarks/results/comparison.json · every bar starts at zero.</text></svg>
