" width="669.4" height="16" rx="2"/><text x="864.4" y="278.0">48.50 ms</text><text x="14" y="308.0">segmentio</text><rect class="peer" x="188.0" y="295.0" width="85.9" height="16" rx="2"/><text x="280.9" y="308.0">6.23 ms</text><text class="panel" x="14" y="361.0">String-rich payloads · escaped + Unicode files</text><text class="gain" x="14" y="382.0">SIMD: 9.4× faster than fastest strict peer · 3.0× faster than portable</text><line class="grid" x1="188.0" y1="409.0" x2="188.0" y2="581.0"/><text class="note" x="188.0" y="406.0" text-anchor="middle">0 ns</text><line class="grid" x1="533.0" y1="409.0" x2="533.0" y2="581.0"/><text class="note" x="533.0" y="406.0" text-anchor="middle">1.00 ms</text><line class="grid" x1="878.0" y1="409.0" x2="878.0" y2="581.0"/><text class="note" x="878.0" y="406.0" text-anchor="middle">2.00 ms</text><text x="14" y="436.0">vibejson portable</text><rect class="portable" x="188.0" y="423.0" width="11.4" height="16" rx="2"/><text x="206.4" y="436.0">33.0 µs</text><text x="14" y="466.0">vibejson SIMD</text><rect class="simd" x="188.0" y="453.0" width="3.8" height="16" rx="2"/><text x="198.8" y="466.0">11.1 µs</text><text x="14" y="496.0">encoding/json</text><rect class="reference" x="188.0" y="483.0" width="38.2" height="16" rx="2"/><text x="233.2" y="496.0">110.8 µs</text><text x="14" y="526.0">go-json</text><rect class="peer" x="188.0" y="513.0" width="437.0" height="16" rx="2"/><text x="632.0" y="526.0">1.27 ms</text><text x="14" y="556.0">segmentio</text><rect class="peer" x="188.0" y="543.0" width="36.1" height="16" rx="2"/><text x="231.1" y="556.0">104.5 µs</text><text class="note" x="14" y="598">jsoniter is omitted here: its Valid API accepts trailing non-space bytes. All included validators reject the checked late-invalid variant.</text><text class="note" x="14" y="613">Source: benchmarks/results/comparison.json · every bar starts at zero.</text></svg>
