<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="622" viewBox="0 0 1100 622" role="img" aria-labelledby="title desc"><title id="title">Strict whole-document validation</title><desc id="desc">Absolute time from 6-sample per-file medians · valid input · lower is better. Measured on Apple M4 Max at commit 6f25fb70.</desc><style>
