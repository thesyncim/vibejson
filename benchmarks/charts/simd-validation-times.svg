<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="622" viewBox="0 0 1100 622" role="img" aria-labelledby="title desc"><title id="title">Strict whole-document validation</title><desc id="desc">Absolute time from 6-sample per-file medians · valid input · lower is better. Measured on arm64 at commit ba74e524.</desc><style>
