er" x="188.0" y="248.0" width="460.7" height="16" rx="2"/><text x="655.7" y="261.0">33.38 ms</text><text x="14" y="291.0">segmentio</text><rect class="peer" x="188.0" y="278.0" width="64.6" height="16" rx="2"/><text x="259.6" y="291.0">4.68 ms</text><text class="panel" x="14" y="361.0">String-rich payloads · escaped + Unicode files</text><text class="gain" x="14" y="382.0">SIMD: 9.1× faster than fastest strict peer · 3.0× faster than portable</text><line class="grid" x1="188.0" y1="392.0" x2="188.0" y2="564.0"/><text class="note" x="188.0" y="389.0" text-anchor="middle">0 ns</text><line class="grid" x1="533.0" y1="392.0" x2="533.0" y2="564.0"/><text class="note" x="533.0" y="389.0" text-anchor="middle">500.0 µs</text><line class="grid" x1="878.0" y1="392.0" x2="878.0" y2="564.0"/><text class="note" x="878.0" y="389.0" text-anchor="middle">1.00 ms</text><text x="14" y="419.0">vibejson portable</text><rect class="portable" x="188.0" y="406.0" width="15.0" height="16" rx="2"/><text x="210.0" y="419.0">21.7 µs</text><text x="14" y="449.0">vibejson SIMD</text><rect class="simd" x="188.0" y="436.0" width="5.1" height="16" rx="2"/><text x="200.1" y="449.0">7.4 µs</text><text x="14" y="479.0">encoding/json</text><rect class="reference" x="188.0" y="466.0" width="49.6" height="16" rx="2"/><text x="244.6" y="479.0">71.8 µs</text><text x="14" y="509.0">go-json</text><rect class="peer" x="188.0" y="496.0" width="586.7" height="16" rx="2"/><text x="781.7" y="509.0">850.3 µs</text><text x="14" y="539.0">segmentio</text><rect class="peer" x="188.0" y="526.0" width="46.4" height="16" rx="2"/><text x="241.4" y="539.0">67.3 µs</text><text class="note" x="14" y="598">jsoniter is omitted here: its Valid API accepts trailing non-space bytes. All included validators reject the checked late-invalid variant.</text><text class="note" x="14" y="613">Source: benchmarks/results/comparison.json · every bar starts at zero.</text></svg>
