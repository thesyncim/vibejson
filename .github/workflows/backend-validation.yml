name: backend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark sampling profile
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
      comparison_baseline:
        description: Optional git ref for an interleaved regression comparison
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOEXPERIMENT: simd

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Pull requests and main pushes need directional signal from these noisy
      # hosted runners; authoritative publication remains workflow_dispatch.
      BENCHTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'full' && '500ms' || '250ms' }}
      BENCHCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'full' && '12' || '3' }}
      CORRECTNESS_FLAGS: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'full' && '' || '-short' }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up stable Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Set up pinned Go tip
        uses: ./.github/actions/setup-gotip
        with:
          destination: ${{ runner.temp }}/gotip
      - name: Select matched amd64 ISA level
        if: ${{ runner.arch == 'X64' }}
        shell: bash
        run: echo 'GOAMD64=v3' >> "$GITHUB_ENV"
      - name: Toolchain and CPU
        shell: bash
        run: |
          go version
          "$RUNNER_TEMP/gotip/bin/go" version
          uname -a
          lscpu | sed -n '1,30p'
      - name: Pure-Go correctness
        shell: bash
        env:
          GOEXPERIMENT: nosimd
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gotip/bin/go" test ./... -count=1 $CORRECTNESS_FLAGS \
            2>&1 | tee "$RUNNER_TEMP/purego-tests-${RUNNER_ARCH}.txt"
      - name: SIMD correctness
        shell: bash
        env:
          GOEXPERIMENT: simd
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gotip/bin/go" test ./... -count=1 $CORRECTNESS_FLAGS \
            2>&1 | tee "$RUNNER_TEMP/simd-tests-${RUNNER_ARCH}.txt"
      - name: Stable-Go portable kernels
        env:
          GOEXPERIMENT: nosimd
        if: ${{ github.event_name != 'pull_request' && inputs.comparison_baseline == '' }}
        shell: bash
        run: |
          set -o pipefail
          go test ./x/kernels ./x/scanner ./simd \
            -run '^$' -bench '^(BenchmarkStage1|BenchmarkScan)' \
            -benchmem -benchtime="$BENCHTIME" -count="$BENCHCOUNT" -cpu=1 \
            2>&1 | tee "$RUNNER_TEMP/stable-portable-kernels-${RUNNER_ARCH}.txt"
      - name: Pure-Go kernels
        if: ${{ github.event_name != 'pull_request' && inputs.comparison_baseline == '' }}
        shell: bash
        env:
          GOEXPERIMENT: nosimd
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gotip/bin/go" test ./x/kernels ./x/scanner ./simd \
            -run '^$' -bench '^(BenchmarkStage1|BenchmarkScan)' \
            -benchmem -benchtime="$BENCHTIME" -count="$BENCHCOUNT" -cpu=1 \
            2>&1 | tee "$RUNNER_TEMP/purego-kernels-${RUNNER_ARCH}.txt"
      - name: SIMD kernels
        if: ${{ github.event_name != 'pull_request' && inputs.comparison_baseline == '' }}
        shell: bash
        env:
          GOEXPERIMENT: simd
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gotip/bin/go" test ./x/kernels ./x/scanner ./simd \
            -run '^$' -bench '^(BenchmarkStage1|BenchmarkScan)' \
            -benchmem -benchtime="$BENCHTIME" -count="$BENCHCOUNT" -cpu=1 \
            2>&1 | tee "$RUNNER_TEMP/simd-kernels-${RUNNER_ARCH}.txt"
      - name: Stable-Go portable end-to-end
        env:
          GOEXPERIMENT: nosimd
        if: ${{ github.event_name != 'pull_request' && inputs.comparison_baseline == '' }}
        shell: bash
        run: |
          set -o pipefail
          go test . \
            -run '^$' -bench '^(BenchmarkPortableBackend|BenchmarkBuildIndex|BenchmarkDecodeSmall$|BenchmarkDecodeUint64Array16$|BenchmarkDecodeLargeReused$|BenchmarkEncodeLarge$)' \
            -benchmem -benchtime="$BENCHTIME" -count="$BENCHCOUNT" -cpu=1 \
            2>&1 | tee "$RUNNER_TEMP/stable-portable-end-to-end-${RUNNER_ARCH}.txt"
      - name: Pure-Go end-to-end
        if: ${{ github.event_name != 'pull_request' && inputs.comparison_baseline == '' }}
        shell: bash
        env:
          GOEXPERIMENT: nosimd
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gotip/bin/go" test . \
            -run '^$' -bench '^(BenchmarkPortableBackend|BenchmarkBuildIndex|BenchmarkDecodeSmall$|BenchmarkDecodeUint64Array16$|BenchmarkDecodeLargeReused$|BenchmarkEncodeLarge$)' \
            -benchmem -benchtime="$BENCHTIME" -count="$BENCHCOUNT" -cpu=1 \
            2>&1 | tee "$RUNNER_TEMP/purego-end-to-end-${RUNNER_ARCH}.txt"
      - name: SIMD end-to-end
        if: ${{ github.event_name != 'pull_request' && inputs.comparison_baseline == '' }}
        shell: bash
        env:
          GOEXPERIMENT: simd
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gotip/bin/go" test . \
            -run '^$' -bench '^(BenchmarkPortableBackend|BenchmarkBuildIndex|BenchmarkDecodeSmall$|BenchmarkDecodeUint64Array16$|BenchmarkDecodeLargeReused$|BenchmarkEncodeLarge$)' \
            -benchmem -benchtime="$BENCHTIME" -count="$BENCHCOUNT" -cpu=1 \
            2>&1 | tee "$RUNNER_TEMP/simd-end-to-end-${RUNNER_ARCH}.txt"
      - name: Install benchstat for the PR comparison
        if: ${{ github.event_name == 'pull_request' || inputs.comparison_baseline != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260610192853-712aea8b4705

      # PRs use a bounded interleaved gate; main/manual runs retain the broad
      # backend matrix above. Both paths run correctness before timing.
      - name: Interleaved PR regression comparison
        id: public_comparison
        if: ${{ github.event_name == 'pull_request' || inputs.comparison_baseline != '' }}
        shell: bash
        env:
          BASELINE: ${{ inputs.comparison_baseline || github.event.pull_request.base.sha }}
          BENCHSTAT: ${{ runner.temp }}/bin/benchstat
          BENCH_GOEXPERIMENT: simd
          GOAMD64: v1
        run: |
          set -o pipefail
          export BENCH_GO="$(command -v go)"
          ./scripts/bench-gate.sh -b "$BASELINE" -d x/kernels -c 1 -n 10 -t 250ms -r 5 '^BenchmarkStage1Block$' \
            2>&1 | tee "$RUNNER_TEMP/pr-stage1-${RUNNER_ARCH}.txt"
          BENCH_CORRECTNESS_PATTERN='^Test(Canonicalize|DepthLimitAgreement|StringDecodingVsStdlib|ValidLongStringFallback|AppendDecodedJSONStringMalformedInputIsLossless)' \
          ./scripts/bench-gate.sh -b "$BASELINE" -d . -c 9 -n 10 -t 250ms -r 5 \
            '^Benchmark(BuildIndex|DecodeSmall|DecodeUint64Array16|DecodeLargeReused|EncodeLarge|ValidLarge|ValidLongString|ValidLongUnicodeString)$' \
            2>&1 | tee "$RUNNER_TEMP/pr-end-to-end-${RUNNER_ARCH}.txt"
          BENCH_CORRECTNESS_PATTERN='^TestHook' \
          ./scripts/bench-gate.sh -b "$BASELINE" -d . -c 2 -n 10 -t 250ms -r 5 \
            '^BenchmarkHookDecode(Small|Large)$/^hook$' \
            2>&1 | tee "$RUNNER_TEMP/pr-hooks-${RUNNER_ARCH}.txt"

      - name: Interleaved ARM formatter regression comparison
        if: ${{ (github.event_name == 'pull_request' || inputs.comparison_baseline != '') && runner.arch == 'ARM64' }}
        shell: bash
        env:
          BASELINE: ${{ inputs.comparison_baseline || github.event.pull_request.base.sha }}
          BENCHSTAT: ${{ runner.temp }}/bin/benchstat
          BENCH_GOEXPERIMENT: simd
        run: |
          set -o pipefail
          export BENCH_GO="$(command -v go)"
          ./scripts/bench-gate.sh -b "$BASELINE" -d simd -c 2 -n 10 -t 250ms -r 5 \
            '^Benchmark(Store16Digits|StoreDateTimeDigits)$/^selected$' \
            2>&1 | tee "$RUNNER_TEMP/pr-format-${RUNNER_ARCH}.txt"

      - name: Profile a failed PR comparison
        if: ${{ failure() && steps.public_comparison.conclusion == 'failure' }}
        shell: bash
        env:
          GOEXPERIMENT: simd
          GOAMD64: v1
          GOTOOLCHAIN: local
        run: |
          repo_id=$(printf '%s' "$PWD" | cksum | cut -d ' ' -f 1)
          work="${TMPDIR:-/tmp}/vibejson-bench-gate-$repo_id"
          go test -c -o "$work/profile-new.test" .
          (cd "$work/baseline" && go test -c -o "$work/profile-old.test" .)
          for name in DecodeSmall DecodeLargeReused ValidLarge ValidLongUnicodeString; do
            for side in old new; do
              profile="$work/$name-$side.cpu"
              binary="$work/profile-$side.test"
              "$binary" -test.run '^$' -test.bench "^Benchmark$name$" -test.cpu=1 \
                -test.benchtime=3s -test.cpuprofile="$profile" \
                >"$RUNNER_TEMP/profile-$name-$side-${RUNNER_ARCH}.txt"
              go tool pprof -top -nodecount=35 "$binary" "$profile" \
                >>"$RUNNER_TEMP/profile-$name-$side-${RUNNER_ARCH}.txt"
              go tool pprof -top -cum -nodecount=35 "$binary" "$profile" \
                >>"$RUNNER_TEMP/profile-$name-$side-${RUNNER_ARCH}.txt"
            done
          done

      - name: Upload backend results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-validation-${{ matrix.runner }}-${{ runner.arch }}
          path: ${{ runner.temp }}/*.txt
          if-no-files-found: error
