name: performance

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Git ref to compare against
        required: true
      architecture:
        description: Dedicated Linux runner architecture
        type: choice
        options: [x64, arm64]
        default: x64

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOEXPERIMENT: simd

jobs:
  benchmark-contracts:
    runs-on: [self-hosted, linux, '${{ inputs.architecture }}', vibejson-performance]
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      BASELINE: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up stable Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Capture stable Go
        shell: bash
        run: |
          stable_go=$(command -v go)
          "$stable_go" version
          printf 'STABLE_GO=%s\n' "$stable_go" >> "$GITHUB_ENV"

      - name: Set up pinned Go tip
        uses: ./.github/actions/setup-gotip
        with:
          destination: ${{ runner.temp }}/gotip
          cache-scope: performance

      - name: Install benchstat with stable Go
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" "$STABLE_GO" install golang.org/x/perf/cmd/benchstat@v0.0.0-20260610192853-712aea8b4705

      - name: Benchmark regression gates
        shell: bash
        run: |
          set -euo pipefail
          run_gate() {
            local label=$1 go_bin=$2 experiment=$3 dir=$4 count=$5 pattern=$6
            local -a args=(-b "$BASELINE" -c "$count" -n 12 -t 500ms -r 2)
            if [[ -n $dir ]]; then
              args=(-d "$dir" "${args[@]}")
            fi
            if [[ -n $pattern ]]; then
              args+=("$pattern")
            fi
            echo "== $label =="
            BENCH_GO="$go_bin" BENCH_GOEXPERIMENT="$experiment" \
              BENCHSTAT="$RUNNER_TEMP/bin/benchstat" \
              ./scripts/bench-gate.sh "${args[@]}"
          }
          run_gate stable-portable-high-level "$STABLE_GO" nosimd "" 63 ""
          run_gate stable-portable-resource "$STABLE_GO" nosimd . 3 \
            '^Benchmark(EncodeTinyAfterHuge|StructuralTapeTinyAfterHuge|MarshalSmall)$'
          run_gate stable-portable-hooks "$STABLE_GO" nosimd . 5 \
            '^Benchmark(HookDecodeLarge|HookEncodeLarge|HookDecodeUnknownField)$'
          run_gate tip-simd-high-level "$RUNNER_TEMP/gotip/bin/go" simd "" 63 ""
          run_gate tip-simd-resource "$RUNNER_TEMP/gotip/bin/go" simd . 4 \
            '^Benchmark(EncodeTinyAfterHuge|StructuralTapeTinyAfterHuge|MarshalSmall)$'
          run_gate tip-simd-hooks "$RUNNER_TEMP/gotip/bin/go" simd . 5 \
            '^Benchmark(HookDecodeLarge|HookEncodeLarge|HookDecodeUnknownField)$'
